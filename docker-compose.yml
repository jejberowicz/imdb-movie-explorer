# The whole project from scratch with one command: docker compose up --build
#
# Start order, each step waiting for the previous one:
#   db (healthy) -> seed (migrations + CSV load, then exits) -> api (healthy) -> web
#
# The passwords below are defaults for a local database that is never published outside the Docker network.
# Override them in a .env file (see .env.example).
name: imdb-movie-explorer

# The owner runs the migrations and the load; the API connects with a user that can only read. The superuser
# can't log in over the network (db/init/01-roles.sh).
x-owner-url: &owner-url postgresql+psycopg://movies:${MOVIES_DB_PASSWORD:-movies-local-only}@db:5432/movies
x-api-url: &api-url postgresql+psycopg://movies_api:${API_DB_PASSWORD:-api-local-only}@db:5432/movies

# Every container: no Linux capabilities and no way to gain privileges (setuid binaries) after it starts. Each
# one also gets a cap on memory and processes, so a leak or a fork bomb stays inside it.
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:18.6-trixie
    <<: *hardened
    # The entrypoint starts as root: it takes ownership of the data directory and switches to the postgres user.
    # Only what that needs is given back.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # Everything it writes goes to the volume, the socket directory and /tmp.
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    mem_limit: 512m
    pids_limit: 200
    restart: unless-stopped
    environment:
      POSTGRES_DB: movies
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-only}
      MOVIES_DB_PASSWORD: ${MOVIES_DB_PASSWORD:-movies-local-only}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api-local-only}
    volumes:
      - db-data:/var/lib/postgresql
      # Creates the owner and the read-only user of the API, the first time only
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      # Over TCP, as seed and the API connect. The Unix socket already answers while the entrypoint runs the
      # init scripts on a temporary server, which doesn't listen on TCP: seed could start too early and fail.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U movies -d movies"]
      interval: 2s
      timeout: 3s
      retries: 30

  seed:
    image: imdb-movie-explorer/api:local
    build:
      context: ./backend
      target: runtime
    command: ["sh", "-c", "alembic upgrade head && flask --app app seed /data/IMDb_movies.csv.gz"]
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    # The load holds the 85.855 clean rows in memory before writing them.
    mem_limit: 1g
    pids_limit: 64
    environment:
      DATABASE_URL: *owner-url
    volumes:
      - ./data:/data:ro
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: imdb-movie-explorer/api:local
    build:
      context: ./backend
      target: runtime
    <<: *hardened
    # Gunicorn keeps the heartbeat files of its workers in /tmp.
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 64
    restart: unless-stopped
    environment:
      DATABASE_URL: *api-url
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      # nginx is in front and adds X-Forwarded-For: the API takes the client IP from there.
      PROXY_HOPS: 1
      RATE_LIMIT: ${RATE_LIMIT:-300 per minute}
    # Published only on this machine, for Swagger, Postman and curl. The browser goes through nginx (/api).
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # The only service on both networks: nginx reaches it, and it reaches the database.
    networks: [backend, frontend]
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    image: imdb-movie-explorer/web:local
    build: ./frontend
    <<: *hardened
    # nginx-unprivileged writes its pid and its temporary files in /tmp.
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    # nginx starts one worker per CPU.
    pids_limit: 128
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  # The database and the load: internal, without a route out, and out of reach of nginx, which is the service
  # exposed to the network.
  backend:
    internal: true
  # nginx and the API
  frontend:

volumes:
  db-data:
