# Every push and pull request: style, types, tests and dependency audit, plus the whole stack started with
# docker compose. The actions are pinned to a commit: a tag can be moved to other code, a commit can't.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      # The tests use a real PostgreSQL: the search depends on pg_trgm and on its collation.
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: movies
          POSTGRES_PASSWORD: movies
          POSTGRES_DB: movies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movies -d movies_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://movies:movies@localhost:5432/movies_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Style
        run: ruff check . && ruff format --check .
      - name: Tests, the acceptance criteria against the whole CSV included
        run: pytest
      - name: Known vulnerabilities in the dependencies
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Types and build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Known vulnerabilities in the dependencies
        run: npm audit --audit-level=moderate

  # The README promises that docker compose up starts everything: this checks it, from an empty database.
  stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack and wait until every service is healthy
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: |
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -sf http://127.0.0.1:8080/api/health/ready | grep -q '"movies":85855'
          curl -sf 'http://127.0.0.1:8080/api/movies?title=shawshank' | grep -q '"imdb_title_id":"tt0111161"'
          curl -sI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          # Swagger UI has no CSP: it must stay off the public origin
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/docs/swagger)" = 404
      - name: Logs, if something failed
        if: failure()
        run: docker compose logs
      - run: docker compose down --volumes
