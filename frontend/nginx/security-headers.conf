# Security headers of the app (docs/security-plan.md). Included in each location that serves the app: nginx
# drops the server-level add_header lines in any location that has its own.
#
# The CSP allows only this origin: the fonts are self-hosted and the app calls only /api. React sets styles
# through the DOM, which the CSP allows, so neither inline scripts nor 'unsafe-inline' are needed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
