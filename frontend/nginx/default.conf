server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Text compresses to a fraction: the main script goes from 373 KB to 118 KB.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

    # Swagger UI needs its own inline scripts, so it has no CSP: it stays on the API port, published only on
    # 127.0.0.1, and not on the public origin of the app.
    location ^~ /api/docs {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # The API under the same origin, so the browser needs no CORS: /api/movies -> http://api:8000/movies
    # Its security headers come from Flask.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # nginx is the first hop: it replaces whatever X-Forwarded-For the client sent with the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files carry a hash in their name: a new build means a new name, so they can be cached for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: any other path gets index.html and React Router takes over. index.html is checked on
    # every visit, so a new deploy shows up right away.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
