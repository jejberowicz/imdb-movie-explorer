# A coarse limit per client IP in front of the API. Flask-Limiter (300 per minute) counts only the requests that
# reach one of its routes, so a flood of 404s or 405s went through uncounted; this one counts every request to
# /api/. It is looser, so the API's limit is still the one a person meets: typing a search (one request per
# 300 ms pause) or opening a page (movies, genres and countries at once) stays far below it.
# The image includes conf.d/*.conf inside http {}, where the zones must be defined.
limit_req_zone $binary_remote_addr zone=api_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_connections:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Relative redirects: an absolute one (/api -> /api/) would carry the port inside the container, 8080, and not
    # the one the browser used.
    absolute_redirect off;

    # Text compresses to a fraction: the main script goes from 373 KB to 118 KB.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

    # Swagger UI needs its own inline scripts, so it has no CSP: it stays on the API port, published only on
    # 127.0.0.1, and not on the public origin of the app.
    location ^~ /api/docs {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # The API under the same origin, so the browser needs no CORS: /api/movies -> http://api:8000/movies
    # Its security headers come from Flask.
    location /api/ {
        # Bursts of 50 pass at once; past that, 10 per second. 20 open requests at a time per IP.
        limit_req zone=api_requests burst=50 nodelay;
        limit_req_status 429;
        limit_conn api_connections 20;
        limit_conn_status 429;
        # Only nginx's own 429: the API's passes through as it is, with its Retry-After.
        error_page 429 = @too_many_requests;

        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # nginx is the first hop: it replaces whatever X-Forwarded-For the client sent with the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The same Problem Details shape as every error of the API (docs/api.md).
    location @too_many_requests {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 1 always;
        default_type application/problem+json;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests from this address."}';
    }

    # Built files carry a hash in their name: a new build means a new name, so they can be cached for a year.
    # Without `always`, only a found file gets it: a 404 for a missing chunk must not be cached for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: any other path gets index.html and React Router takes over. index.html is checked on
    # every visit, so a new deploy shows up right away.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
