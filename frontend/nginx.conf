server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API under the same origin, so the browser needs no CORS: /api/movies -> http://api:8000/movies
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # nginx is the first hop: it replaces whatever X-Forwarded-For the client sent with the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: any other path gets index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
    }
}
